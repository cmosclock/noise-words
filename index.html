<style>
/* Layout: one frosted sheet of noise text in the hearth of the sky, a bar above it and a dock pill below.
   Ollune's language throughout: no words on screen except the noise text itself, numerals joined by middle dots,
   and "ollu"/"teelu" in the bubble. Dark-only, like Ollune and Five Beads. */
:root {
  color-scheme: dark;

  /* dusk surfaces: twilight plum-slate, never black */
  --dusk-deep: #1e1c27;
  --dusk-0: #24222f;
  --dusk-1: #2c2939;
  --dusk-2: #36324a;
  --dusk-3: #403b56;
  --dusk-glow: #322e44;
  --line: #4b4662;

  /* ink */
  --ink: #e6e1f0;
  --ink-dim: #aba4c2;
  --ink-faint: #736c8c; /* decorative only, never text */

  /* accents, one job each */
  --peach: #f3c6ae;  /* first side: a filled core */
  --lilac: #c6b6f2;  /* second side: a slotted halo */
  --rose: #f2b3c8;   /* now and here: whose turn, focus, last bead, your table */
  --butter: #f0e1a4; /* the win */
  --mint: #a6dec9;   /* online */
  --sky: #a7c7f0;    /* coil decoration only */

  --focus: color-mix(in oklab, var(--rose) 75%, transparent);
  --selection: color-mix(in oklab, var(--rose) 35%, transparent);

  /* type */
  --font: 'Nunito', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', 'Meiryo', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --wt-body: 380;
  --wt-num: 520;
  --wt-word: 560;
  --track-meta: 0.06em;

  /* shape */
  --r-md: 12px;
  --r-xl: 20px;
  --r-pill: 999px;
  --shadow-1: 0 4px 16px rgb(14 12 22 / 0.35);
  --shadow-2: 0 12px 40px rgb(14 12 22 / 0.5);

  /* motion */
  --ease-settle: cubic-bezier(0.22, 0.8, 0.24, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  --t-hover: 140ms;
  --t-whisper: 160ms;
  --t-bloom: 500ms;
  --t-thread: 600ms;
  --t-breath: 6s;
}
/* Noise Words additions */
:root {
  --bar-h: 52px;
  --dock-h: 48px;      /* pill height: 36 px controls + 2 × 6 px padding */
  --frost: color-mix(in oklab, var(--dusk-0) 74%, transparent);
  --hairline: 1px solid color-mix(in oklab, var(--line) 55%, transparent);
}
@media (pointer: coarse) { :root { --dock-h: 56px; } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100svh;
  overflow-x: hidden;
  background: var(--dusk-0);
  color: var(--ink);
  font: var(--wt-body) 15px/1.45 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--selection); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.icon { display: block; flex: none; width: 18px; height: 18px; }

.world { position: relative; min-height: 100svh; }
/* fixed behind everything: the sheet scrolls over a still sky */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

/* --- shared glyph controls (Five Beads) ------------------------------------------------ */
.round {
  position: relative;
  width: 28px; height: 28px; padding: 0; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-dim);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--t-hover) var(--ease-soft), color var(--t-hover) var(--ease-soft), opacity var(--t-hover) var(--ease-soft);
}
.round .icon { width: 16px; height: 16px; }
.round:hover, .round:focus-visible { background: var(--dusk-2); color: var(--ink); }
.round.inert { opacity: 0.35; cursor: default; }
.round.inert:hover { background: transparent; color: var(--ink-dim); }
.round.mirror .icon { transform: scaleX(-1); }
#legend-btn[aria-expanded='true'] { background: var(--dusk-3); color: var(--ink); }

.gbtn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 36px; height: 36px; padding: 0 8px; flex: none;
  border: 1px solid var(--line); border-radius: var(--r-pill);
  background: var(--dusk-2); color: var(--ink-dim);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--t-hover) var(--ease-soft), color var(--t-hover) var(--ease-soft), opacity var(--t-hover) var(--ease-soft);
}
.gbtn:hover:not(:disabled) { background: var(--dusk-3); color: var(--ink); }
.gbtn.primary { background: color-mix(in oklab, var(--rose) 20%, var(--dusk-1)); border-color: color-mix(in oklab, var(--rose) 55%, transparent); color: var(--ink); }
.gbtn.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--rose) 30%, var(--dusk-1)); }
.gbtn:disabled { opacity: 0.35; cursor: default; }
.gbtn .num { font-size: 12px; font-weight: var(--wt-num); }

/* Ollune's slit-beat: a rose ring that breathes around whatever wants a first touch */
@keyframes beat {
  0%, 100% { opacity: 0.2; transform: scale(0.92); }
  50% { opacity: 0.8; transform: scale(1.06); }
}
.beat, .beat3, .beat8 { position: relative; }
.beat::before, .beat3::before, .beat8::before {
  content: ''; position: absolute; inset: -3px; border-radius: inherit;
  border: 1.5px solid var(--rose); pointer-events: none; opacity: 0;
  animation: beat 2.4s var(--ease-soft) infinite;
  animation-delay: var(--beat-at, 0s); /* negative: resume a beat that started before this node existed */
}
.beat3::before { animation-iteration-count: 3; }
.beat8::before { animation-iteration-count: 8; }
/* one 600 ms pulse */
@keyframes pulse { from { opacity: 0.8; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
.pulse { position: relative; }
.pulse::before {
  content: ''; position: absolute; inset: -2px; border-radius: 50%;
  border: 1.5px solid var(--rose); pointer-events: none; opacity: 0;
  animation: pulse 600ms var(--ease-soft);
}
@keyframes fade-in { from { opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes arrive { from { opacity: 0; transform: scale(0.6); } }
@keyframes winglow { from { opacity: 0.65; } to { opacity: 1; } }
.dots circle { animation: dot 1.2s var(--ease-soft) infinite; }
.dots circle:nth-child(2) { animation-delay: 0.3s; }
.dots circle:nth-child(3) { animation-delay: 0.6s; }
@keyframes dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

/* pattern beads: NW.pattern.bead() sets size, --fd (dot size) and --fi (dot inset); NW.pattern.ensure() supplies --pat */
.pbead {
  position: relative; display: inline-block; flex: none; vertical-align: middle;
  border-radius: 50%;
  background: var(--pat) 0 0 / 6px 6px;
}
.pbead .fd { position: absolute; width: var(--fd); height: var(--fd); border-radius: 50%; background: var(--dusk-deep); }
/* pattern.js names the dots fd-n/e/s/w (a bare .w would collide with the markable-word class) */
.pbead .fd-n { top: var(--fi); left: 50%; transform: translate(-50%, -50%); }
.pbead .fd-s { bottom: var(--fi); left: 50%; transform: translate(-50%, 50%); }
.pbead .fd-e { right: var(--fi); top: 50%; transform: translate(50%, -50%); }
.pbead .fd-w { left: var(--fi); top: 50%; transform: translate(-50%, -50%); }

/* --- top bar ------------------------------------------------------------------------------ */
.bar {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top);
  background: var(--frost);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: var(--hairline);
}
.bar-in { width: min(680px, 100% - 32px); height: var(--bar-h); margin-inline: auto; display: flex; align-items: center; gap: 8px; }
#mark { width: 34px; height: 20px; flex: none; margin-right: 4px; }
#mark .b { fill: var(--ink-faint); }
.daynav { display: flex; align-items: center; gap: 4px; }
.date { display: grid; justify-items: center; gap: 3px; min-width: 52px; padding: 0 2px; }
.date .dn { font-size: 12px; line-height: 14px; font-weight: var(--wt-num); color: var(--ink-dim); letter-spacing: var(--track-meta); white-space: nowrap; }
.wd { display: flex; align-items: center; gap: 4px; height: 4px; }
.wd i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint); }
.wd i:nth-child(6) { margin-left: 2px; }   /* 4 px gap + 2 px: the weekend sits 6 px apart */
.wd i.we { background: color-mix(in oklab, var(--rose) 45%, var(--ink-faint)); }
.wd i.on { background: var(--ink); }
.wd i.we.on { background: var(--rose); }
.bar .gap { flex: 1; min-width: 0; }
.stack {
  position: relative; flex: none;
  display: flex; align-items: center; height: 28px; padding: 0 4px;
  border: 0; border-radius: var(--r-pill); background: transparent; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--t-hover) var(--ease-soft);
}
.stack:hover, .stack:focus-visible, .stack[aria-expanded='true'] { background: var(--dusk-2); }
.stack::after { content: ''; position: absolute; inset: -8px -2px; }
.stack .pbead { box-shadow: 0 0 0 1.5px var(--dusk-0); }
.stack .pbead + .pbead { margin-left: -5px; }
.stack .pbead.away { opacity: 0.45; }   /* Five Beads .seat.gone */
.stack .pbead.arrive { animation: arrive 320ms var(--ease-settle); }
.stack .n { margin-left: 4px; font-size: 12px; font-weight: var(--wt-num); color: var(--ink-dim); }
.conn { position: relative; width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--ink-dim); }
.conn .icon { width: 14px; height: 14px; }
.conn[data-state='on'] { color: var(--mint); }
.conn[data-state='on'] .icon { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in oklab, var(--mint) 20%, transparent); }
.conn[data-state='wait'] .icon { animation: spin 2.4s linear infinite; }
.conn .n { position: absolute; left: 13px; top: -5px; font-size: 10px; font-weight: var(--wt-num); color: var(--ink-dim); }
.conn:has(.n) { margin-right: 6px; }
.save { position: relative; width: 4px; height: 4px; flex: none; border-radius: 50%; background: var(--peach); opacity: 0.55; transition: opacity var(--t-whisper) var(--ease-soft); }
.save.pulse { opacity: 1; }
.save.pulse::before { inset: -4px; border-color: var(--peach); }

/* --- the sheet and its page of words ---------------------------------------------------------- */
.sheet {
  position: relative;
  width: min(680px, 100% - 32px);
  margin: 16px auto calc(16px + env(safe-area-inset-bottom));
  padding: 32px 40px calc(var(--dock-h) + 32px);
  border-radius: var(--r-xl);
  background: var(--frost);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: var(--hairline);
  box-shadow: var(--shadow-2);
  transition: border-color var(--t-hover) var(--ease-soft);
}
.sheet:has(.page:focus-visible) { border-color: var(--focus); }
.page {
  outline: none;
  font-size: 18px; font-weight: var(--wt-body); line-height: 2.05;
  text-wrap: pretty; overflow-wrap: anywhere;
  color: var(--ink);
  touch-action: pan-y pinch-zoom;   /* vertical scroll and pinch stay native; a horizontal start is a stroke (§7.5) */
  /* the text selects and copies like any text: a mouse drag or double-click, a long-press on a phone (§7.6) */
  user-select: text; -webkit-user-select: text;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-drag: none;
}
.page.zoomed { touch-action: manipulation; }   /* pinch-zoomed in: one finger pans the view every way, no strokes */
.page p { margin: 0 0 0.5em; }
.page p:last-child { margin-bottom: 0; }
.page.swap { animation: fade-in var(--t-whisper) var(--ease-soft); }
.page.arrive p { animation: fade-in 400ms var(--ease-soft) both; }
.page.arrive p:nth-child(2) { animation-delay: 400ms; }
.page.arrive p:nth-child(3) { animation-delay: 800ms; }
.fw { color: var(--ink-dim); cursor: default; }
.nb { white-space: nowrap; }   /* a word and its punctuation never part at a line end */

/* a markable word: an inline-block spanning the whole 2.05em line box, so its hit area is the full line height.
   Geometry in em of the text size (no descenders): baseline about 1.354em from the top. */
.w {
  --bd: 0ms;
  display: inline-block; position: relative; isolation: isolate;
  padding-inline: 0.1em; margin-inline: -0.1em;
  border-radius: 6px;
  cursor: pointer;
  transition: color var(--t-whisper) var(--ease-soft) var(--bd), text-shadow 200ms var(--ease-soft) var(--bd);
}
.w .f {
  position: absolute; z-index: -1; left: 0; right: 0; top: 0.30em; height: 1.22em;
  border-radius: 6px;
  background: var(--pat) 0 0 / 6px 6px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-whisper) var(--ease-soft), box-shadow 200ms var(--ease-soft) var(--bd);
}
.w .rb {
  position: absolute; left: 0.1em; right: 0.1em; top: 1.65em; height: 5px;
  display: flex; gap: 1px; border-radius: 2.5px; overflow: hidden;
  pointer-events: none;
}
.w .rb b { flex: 1; min-width: 0; background: var(--pat) 0 0 / 6px 6px; transform-origin: left center; transition: opacity var(--t-whisper) var(--ease-soft); }
.w .rb b.grow { animation: grow 320ms var(--ease-settle) var(--d, 0ms) both; }
.w .rb b.out { opacity: 0; }
@keyframes grow { from { transform: scaleX(0); } }
/* outlines and rings sit on the fill box, not on the whole line box */
.w::after { content: ''; position: absolute; left: 0; right: 0; top: 0.30em; height: 1.22em; border-radius: 6px; pointer-events: none; }
.w.beat3::before, .w.spark::before { inset: auto; left: -3px; right: -3px; top: calc(0.30em - 3px); height: calc(1.22em + 6px); border-radius: 8px; }

.w.mine { color: var(--dusk-deep); }
.w.mine .f { opacity: 1; }
.w.ghost .f { opacity: 0.3; }
.w.unmark .f, .w.mine.sweep .f { opacity: 0.35; }
.w.unmark::after, .w.mine.sweep::after { outline: 1.5px dashed var(--ink-dim); outline-offset: 1px; }
/* a stroke in progress: what it would mark at .5, and the words past the ink as a dotted outline (an erase stroke looks like .unmark) */
.w.sweep:not(.mine) .f { opacity: 0.5; }
.w.over::after { outline: 1.5px dotted var(--ink-faint); }
.w.pending::after { outline: 1.5px dashed var(--rose); }
.w.kb::after { outline: 1.5px dashed var(--rose); outline-offset: 2px; }
.w.butter { color: var(--butter); text-shadow: 0 0 10px color-mix(in oklab, var(--butter) 45%, transparent); }
.w.mine.butter { color: var(--dusk-deep); text-shadow: none; }
.w.mine.butter .f { box-shadow: 0 0 0 1.5px var(--butter); }
.w.glow-in { animation: winglow 600ms ease-in-out var(--bd) 2 alternate-reverse; }
.w.spark::before {
  content: ''; position: absolute; pointer-events: none; opacity: 0;
  border: 1.5px solid var(--butter);
  animation: pulse 600ms var(--ease-soft);
}
/* first run: a neutral ghost fill breathes inside a rose ring until the first mark */
.w.hint .f { background: repeating-linear-gradient(135deg, var(--ink-faint) 0 2px, transparent 2px 5px); animation: hint 2.4s var(--ease-soft) infinite alternate; }
@keyframes hint { from { opacity: 0.3; } to { opacity: 0.55; } }
/* spotlight: one player's marks as full fills, everything else steps back */
.page[data-spot] .w.mine:not(.lit) .f, .page[data-spot] .w .rb b { opacity: 0.2; }
.page[data-spot] .w.lit .f { opacity: 1; }
.page[data-spot] .w.lit { color: var(--dusk-deep); text-shadow: none; }
.page[data-spot] .w.mine:not(.lit) { color: var(--ink); }

/* --- dock ------------------------------------------------------------------------------------ */
.dock {
  --kb: 0px;   /* how far the on-screen keyboard covers the layout viewport (visualViewport) */
  position: fixed; z-index: 25;
  left: 0; right: 0; margin-inline: auto;
  bottom: calc(12px + env(safe-area-inset-bottom) + var(--kb));
  width: max-content; max-width: calc(100% - 24px); min-height: var(--dock-h);
  display: flex; align-items: center; gap: 12px;
  padding: 6px 10px;
  border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--dusk-2) 96%, transparent);
  box-shadow: var(--shadow-2);
}
.dock .wait { color: var(--ink-faint); padding: 0 8px; }
.me-btn { width: 36px; height: 36px; }
.me-btn .pbead { box-shadow: 0 0 0 1px var(--dusk-1); }
.me-btn .badge { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--dusk-2); color: var(--ink); display: grid; place-items: center; }
.me-btn .badge .icon { width: 10px; height: 10px; }
.me-btn.slide { animation: slide 320ms var(--ease-settle); }
@keyframes slide { from { transform: translate(var(--sx, 0), var(--sy, 0)); } }
.rail { display: flex; align-items: center; gap: 5px; padding: 0 2px; }
.rail i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
.rail i.spent { background: var(--pat) 0 0 / 6px 6px; box-shadow: 0 0 0 1px var(--dusk-1); }
.rail i.pend { background: var(--pat) 0 0 / 6px 6px; opacity: 0.5; }
.rail.wob { animation: wob 300ms linear; }
@keyframes wob { 0%, 33.3%, 66.6%, 100% { transform: none; } 8.3%, 41.6%, 75% { transform: translateX(3px); } 25%, 58.3%, 91.6% { transform: translateX(-3px); } }
.eye .num:empty { display: none; }

/* the name gate replaces the dock content */
.gate { display: flex; align-items: center; gap: 12px; margin: 0; border-radius: var(--r-pill); }
.gate > .icon { width: 16px; height: 16px; color: var(--ink-dim); }
.gate input {
  width: clamp(80px, 100vw - 240px, 200px); min-width: 0; height: 32px; padding: 0 2px;
  border: 0; border-bottom: 1px solid var(--line); border-radius: 0; outline: none;
  background: transparent; color: var(--ink);
  font: var(--wt-word) 16px var(--font);
  caret-color: var(--pa, var(--rose));
  user-select: text; -webkit-user-select: text;
  transition: border-color var(--t-hover) var(--ease-soft);
}
.gate input:focus { border-bottom-color: color-mix(in oklab, var(--pa, var(--rose)) 70%, transparent); }
.pv { position: relative; width: 26px; height: 26px; flex: none; display: grid; place-items: center; }
.pv .pbead { animation: fade-in var(--t-whisper) var(--ease-soft); transition: opacity var(--t-whisper) var(--ease-soft); }
.pv.busy .pbead { opacity: 0.4; }
.pv > .icon { position: absolute; inset: 2px; width: 22px; height: 22px; color: var(--ink-dim); animation: spin 2.4s linear infinite; }
.chip-add { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--ink-faint); }

/* --- presence popover ----------------------------------------------------------------------- */
.popover {
  position: fixed; z-index: 30;
  min-width: 120px; max-height: 60svh; overflow: auto;
  display: grid; gap: 2px; padding: 6px;
  border-radius: var(--r-md);
  background: color-mix(in oklab, var(--dusk-2) 96%, transparent);
  box-shadow: var(--shadow-2);
  animation: fade-in var(--t-whisper) var(--ease-soft);
}
.prow {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 44px; padding: 0 12px 0 9px;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink-dim); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--t-hover) var(--ease-soft);
}
.prow:hover:not(.veiled), .prow:focus-visible { background: var(--dusk-3); }
.prow.veiled { opacity: 0.6; cursor: default; }
.prow .ring { position: relative; display: grid; place-items: center; border-radius: 50%; }
.prow.on .ring::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--rose); }
.prow .live { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); flex: none; }

// ---- src/text.js

// ---- src/pattern.js
// Pattern identity for Noise Words: a name becomes a secret key, and a pubkey becomes two pastel hues,
// a 6×6 tile motif and up to four fingerprint dots. That pattern is the only way players are told apart:
// your marks fill words with it, other players' marks are 5 px ribbons of it, and beads show it in the round.
// Classic script: attaches NW.pattern and touches no DOM at load time, so node tests can load it in a vm.
(() => {
'use strict';
const NW = (globalThis.NW = globalThis.NW || {});

// ---- names and secrets ----------------------------------------------------------------------------
// The name is never stored or shown; it only seeds the key. The same name on another device is the same player.
function normalizeName(s) {
  if (typeof s !== 'string') return '';

  return n.length > 64 ? '' : n;   // UTF-16 length, matching the input's maxlength

const N = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n;   // secp256k1 group order
const hex = (u8) => Array.from(u8, (x) => x.toString(16).padStart(2, '0')).join('');

/** PBKDF2-SHA256(name, 'noisewords/v1', 200k) → a valid secp256k1 secret (64 hex). Rejects on an empty name or without WebCrypto. */
async function deriveSecret(name) {
  const norm = normalizeName(name);
  if (!norm) throw new Error('pattern: empty name');
  const subtle = globalThis.crypto && globalThis.crypto.subtle;
  if (!subtle) throw new Error('pattern: WebCrypto unavailable');

  while (big(bits) === 0n || big(bits) >= N) bits = new Uint8Array(await subtle.digest('SHA-256', bits));

// ---- colour ---------------------------------------------------------------------------------------
/** OKLCH → sRGB hex (Ottosson's OKLab matrices), each channel clamped. Display only, so transcendental Math is fine here. */
function oklchToHex(L, C, hDeg) {

// ---- days ---------------------------------------------------------------------------------------------------

  const m = /^#(\d{4}-\d{2}-\d{2})$/.exec(location.hash);
  const d = m && m[1];
  return d && NW.text.isDate(d) && d >= FIRST_DAY() && d <= getToday() ? d : null;
}
function goDay(date) {
  today = getToday();
  if (!NW.text.isDate(date) || date < FIRST_DAY() || date > today || date === S.date) return;
  cancelStroke();
  S.date = date;
  Object.assign(S, { spot: null, pending: null, hover: -1, kb: -1, popover: false });
  bloom = null;
  if (ready) safe(() => NW.net.view(date));
  const url = location.pathname + location.search + (date === today ? '' : '#' + date);
  try { history.replaceState(history.state, '', url); } catch {}
  buildPage(date, arrived.has(date) ? 'swap' : 'arrive');
  arrived.add(date);
  window.scrollTo(0, 0);
  render();
}
const step = (dir) => goDay(NW.text.addDays(S.date, dir));

// ---- input ----------------------------------------------------------------------------------------------------
function wordRects() {
  const out = [];
  if (!P) return out;
  P.els.forEach((el, i) => {
    if (!el) return;
    const r = el.getBoundingClientRect();
    out.push({ i, left: r.left, right: r.right, top: r.top, bottom: r.bottom });
  });
  return out;
}
function setHover(i) {
  if (i === S.hover) return;
  S.hover = i;
  patchPage();
}
/** Keeps the keyboard cursor between the bar and the dock. */
function ensureVisible(el) {
  const r = el.getBoundingClientRect();
  const top = $('bar').getBoundingClientRect().bottom + 8;
  const bottom = $('dock').getBoundingClientRect().top - 8;
  if (r.top < top) window.scrollBy(0, r.top - top);
  else if (r.bottom > bottom) window.scrollBy(0, r.bottom - bottom);
}
const typing = (t) => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
function nextMarkable(from, dir) {
  const n = P.els.length;
  for (let i = from < 0 ? (dir > 0 ? 0 : n - 1) : from + dir; i >= 0 && i < n; i += dir) if (P.els[i]) return i;
  return from;
}
function onEsc() {
  if (S.stroke) return cancelStroke();
  if (!$('legend').hidden) return closeLegend();
  if (S.popover) { S.popover = false; render(); $('stack').focus({ preventScroll: true }); return; }
  if (me && S.gate.open) return closeGate();
  if (S.spot) { S.spot = null; return render(); }
  if (S.pending != null) { S.pending = null; return render(); }
  if (taughtV < 3) { setTaught(taughtV === 0 ? 1 : 3); render(); }   // Esc skips a first-run beat
}

function wire() {
  const page = $('page'), sheet = $('sheet');
  // Taps arrive as clicks: the browser only fires one for a tap, never for a scroll, and touch-action: pan-y pinch-zoom
  // drops the double-tap delay. The whole sheet listens so a tap a little outside a word's box still lands.
  sheet.addEventListener('click', (e) => {
    // the click that follows a committed stroke is the stroke's, not a tap
    if (swallowAt) { const s = Date.now() - swallowAt < 400; swallowAt = 0; if (s) return; }
    const t = e.target;
    if (!t.closest || t.closest('.fw')) return;   // function words are inert
    let w = t.closest('.w');
    if (w && !page.contains(w)) w = null;
    let i = w ? +w.getAttribute('data-i') : nearestWord(wordRects(), e.clientX, e.clientY);
    // the text selects like any text (§7.6): a click that ends or clears a selection is not a tap, and the second click
    // of a double-click takes back the first one's toggle
    const seq = clickSeq;
    const intent = tapIntent({ detail: e.detail, seq, last: lastTap, selDown, selNow: pageSelected() });
    if (intent === 'revert') return revertTap();
    if (intent === 'none') return;
    if (i < 0) { if (S.spot) { S.spot = null; render(); } return; }
    S.kbd = false;
    S.kb = i;
    tap(i, seq);
  });
  // every click counts (capture, before the sheet reads it), and selDown lasts for its press's click only (bubble,
  // after): a later click with no press (assistive tech, el.click()) is judged on the selection alone
  window.addEventListener('click', () => { clickSeq++; }, true);
  window.addEventListener('click', () => { selDown = false; });
  // Strokes (§7.5): a pointerdown only records where it began; a plain tap still arrives as a click. The stroke begins
  // once the pointer travels far enough (touch and pen: within 30° of horizontal; vertical-first is the browser's scroll).
  // A mouse drag is the browser's text selection (§7.6), so only touch and pen stroke, and never over a selection.
  page.addEventListener('pointerdown', (e) => {
    gest = null;
    if (e.pointerType === 'mouse' || pageSelected()) return;
    if (!e.isPrimary || e.button !== 0 || S.stroke || !strokeOk()) return;
    if (e.target.closest && e.target.closest('.fw')) return;   // function words are inert, as for a click
    if (e.pointerType !== 'mouse' && page.classList.contains('zoomed')) return;   // zoomed in, a sideways drag pans
    const w = e.target.closest && e.target.closest('.w');
    const start = w && page.contains(w) ? +w.getAttribute('data-i') : nearestWord(wordRects(), e.clientX, e.clientY, 12);
    if (start < 0) return;
    gest = { id: e.pointerId, type: e.pointerType, x0: e.clientX, y0: e.clientY, start };
  });
  page.addEventListener('pointermove', (e) => {
    // a move with no button held means the release went elsewhere (off the page, or a lost mouse-up): drop the press
    if (S.stroke) { if (e.pointerId === S.stroke.id) { if (e.buttons & 1) moveStroke(e.clientX, e.clientY); else cancelStroke(); } return; }
    if (gest && e.pointerId === gest.id) {
      const m = pressMove(gest.type, e.clientX - gest.x0, e.clientY - gest.y0, e.buttons);
      // a long-press selected text during this press (pointerdown saw none): a slide after it is the browser's, never a stroke
      if (m === 'begin') { if (pageSelected()) { gest = null; return; } return beginStroke(e); }
      if (m === 'drop') gest = null;
    }
    if (e.pointerType !== 'mouse') return;
    // drag-selecting text, or text selected (a click would only clear it): no mark preview under the cursor
    if ((e.buttons & 1) || pageSelected()) return setHover(-1);
    const w = e.target.closest && e.target.closest('.w');
    setHover(w ? +w.getAttribute('data-i') : -1);
  });
  page.addEventListener('pointerup', (e) => {
    if (S.stroke && e.pointerId === S.stroke.id) endStroke(true);
    else if (gest && e.pointerId === gest.id) gest = null;
  });
  page.addEventListener('pointercancel', (e) => {
    if ((S.stroke && e.pointerId === S.stroke.id) || (gest && e.pointerId === gest.id)) cancelStroke();
  });
  // anywhere on the window: a press disarms the swallow (no click follows a moved touch, so it would eat the next tap);
  // a release ends a pending press that #page never saw go up, and a cancelled stroke's release arms the swallow
  window.addEventListener('pointerdown', () => { swallowAt = 0; deadId = null; selDown = pageSelected(); }, true);
  const lift = (e) => {
    if (e.type === 'pointercancel') selDown = false;   // a cancelled press gets no click to reset it
    if (gest && e.pointerId === gest.id) gest = null;
    if (deadId !== null && e.pointerId === deadId) { deadId = null; if (e.type === 'pointerup') swallowAt = Date.now(); }
  };
  window.addEventListener('pointerup', lift, true);
  window.addEventListener('pointercancel', lift, true);
  // only the page's own capture: a touch is implicitly captured by the word it began on, and that capture moving to
  // the page fires lostpointercapture on the word, which bubbles here
  page.addEventListener('lostpointercapture', (e) => { if (e.target === page && S.stroke && e.pointerId === S.stroke.id) cancelStroke(); });
  // once a stroke has begun the page holds the touch: a later vertical turn (wrapping to the next line) does not scroll
  page.addEventListener('touchmove', (e) => { if (S.stroke && e.cancelable) e.preventDefault(); }, { passive: false });
  page.addEventListener('pointerleave', () => setHover(-1));
  // a selection made without moving (a double-click, Ctrl+A) drops the hover preview too
  document.addEventListener('selectionchange', () => { if (S.hover >= 0 && pageSelected()) setHover(-1); });
  page.addEventListener('keydown', (e) => {
    // select all, from the page: just its text, not the bar and the dock around it (on any keyboard layout)
    if (selectAllKey(e)) {
      e.preventDefault();
      const r = document.createRange();
      r.selectNodeContents(page);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || !P) return;
    let i = S.kb;
    switch (e.key) {
      case 'ArrowRight': i = nextMarkable(i, 1); break;
      case 'ArrowLeft': i = nextMarkable(i, -1); break;
      case 'ArrowDown': case 'ArrowUp': {
        if (i < 0) { i = nextMarkable(-1, 1); break; }
        const j = lineStep(wordRects(), i, e.key === 'ArrowDown' ? 1 : -1);
        if (j >= 0) i = j;
        break;
      }
      case 'Enter': case ' ':
        e.preventDefault();
        if (S.kb >= 0) { S.kbd = true; tap(S.kb); }
        return;
      default: return;
    }
    e.preventDefault();
    if (i < 0 || !P.els[i]) return;
    S.kb = i;
    S.kbd = true;
    ensureVisible(P.els[i]);
    announce(wordText(P.page.tokens[i], P.page.count, dv));
    patchPage();
  });
  page.addEventListener('focus', () => {
    S.kbd = page.matches(':focus-visible');
    if (S.kb < 0 && P) S.kb = P.hint >= 0 ? P.hint : nextMarkable(-1, 1);
    patchPage();
  });
  page.addEventListener('blur', () => { S.kbd = false; patchPage(); });

  // the popover sits after the dock in the DOM, so focus moves into it (Esc brings it back to the stack)
  $('stack').addEventListener('click', () => {
    S.popover = !S.popover;
    render();
    if (S.popover) { const r = $('popover').querySelector('.prow'); if (r) r.focus({ preventScroll: true }); }
  });
  // a press outside the popover closes it; on click, so the press that closes it still lands where it was aimed
  document.addEventListener('click', (e) => {
    if (!S.popover) return;
    const t = e.target;
    if ($('popover').contains(t) || $('stack').contains(t)) return;
    S.popover = false;
    render();
  }, true);
  $('retry').addEventListener('click', () => location.reload());
  $('legend-btn').addEventListener('click', (e) => { if ($('legend').hidden || !legendPinned) openLegend(true, e.currentTarget); else closeLegend(); });
  $('legend-scrim').addEventListener('click', closeLegend);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') return onEsc();
    // the pinned legend is modal: it covers the controls, so Tab stays on it
    if (e.key === 'Tab' && legendPinned && !$('legend').hidden) { e.preventDefault(); $('legend').focus(); return; }
    if (legendPinned && !$('legend').hidden) return;   // and nothing reaches the page behind it (E, Alt+←/→)
    if (typing(e.target)) return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); step(e.key === 'ArrowLeft' ? -1 : 1); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if ((e.key === 'e' || e.key === 'E') && !e.repeat) { e.preventDefault(); reveal(); return; }
    if (e.key === '?' && !e.repeat && $('legend').hidden) openLegend(false, document.activeElement);
  });
  document.addEventListener('keyup', (e) => {
    if ((e.key === '?' || e.key === '/' || e.key === 'Shift') && !legendPinned) closeLegend();
  });
  window.addEventListener('hashchange', () => { const d = hashDate(); goDay(d || getToday()); });

  // the dock rides above the on-screen keyboard: iOS keeps the layout viewport, so follow the visual one
  const vv = window.visualViewport;
  if (vv) {
    const follow = () => {
      const off = coarse ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
      $('dock').style.setProperty('--kb', off + 'px');
      $('page').classList.toggle('zoomed', vv.scale > 1.01);   // pinch-zoomed in: a sideways drag pans the view (CSS)
    };
    vv.addEventListener('resize', follow);
    vv.addEventListener('scroll', follow);
  }
  window.addEventListener('resize', () => { queueSky(); queueRender(); });   // the stack's bead cap, the popover's place
  // a background tab renders on the timer; once it is seen again, render so a pending › beat starts now
  document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'hidden') queueRender(); });
  if (window.ResizeObserver) new ResizeObserver(queueSky).observe($('sheet'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueSky);
}

// ---- the sky: gradient, stars, and the coil of your days ---------------------------------------------------
function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let skyPat = null, skyPatPk = null;
async function paintSky() {
  const c = $('sky');
  const ctx = c.getContext('2d');
  if (!ctx) return;
  const W = window.innerWidth, H = window.innerHeight;
  const wide = W >= 900;
  if (wide && me && skyPatPk !== me) {
    const pk = me;
    // canvasPattern resolves null when the tile fails to load; leave skyPatPk unset then, so the next paint retries
    try { skyPat = await NW.pattern.canvasPattern(ctx, pk); skyPatPk = skyPat ? pk : null; } catch { skyPat = null; skyPatPk = null; }
  }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(W * dpr);
  c.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const T = (n) => css.getPropertyValue(n).trim();
  // the hearth is the sheet's centre (as laid out at the top of the page), held inside the viewport
  const sr = $('sheet').getBoundingClientRect();
  const cx = sr.left + sr.width / 2;
  const cy = Math.max(H * 0.3, Math.min(H / 2, sr.top + window.scrollY + sr.height / 2));
  const TAU = Math.PI * 2;

  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * 0.7);
  bg.addColorStop(0, T('--dusk-glow'));
  bg.addColorStop(0.45, T('--dusk-0'));
  bg.addColorStop(1, T('--dusk-deep'));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (wide) {
    // one Archimedean coil, 28 beads a turn: bead k is today − k days, today at 3 o'clock, older days counter-clockwise
    const STEP = TAU / 28, P0 = 34, R0 = sr.width / 2 + 48;
    const maxR = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 24;
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = T('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let t = 0; ; t += STEP / 4) {
      const r = R0 + (P0 * t) / TAU;
      if (r > maxR) break;
      const x = cx + r * Math.cos(-t), y = cy + r * Math.sin(-t);
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    const hist = ready && me ? safe(() => NW.net.history(), null) || new Map() : new Map();
    const teelu = new Set(teeluDates());
    const pal = { faint: T('--ink-faint'), butter: T('--butter'), rose: T('--rose') };
    const t0 = getToday(), first = FIRST_DAY();
    for (let k = 0; ; k++) {
      const t = k * STEP, r = R0 + (P0 * t) / TAU;
      if (r > maxR) break;
      const a = -t, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const date = NW.text.addDays(t0, -k);
      const fade = Math.max(0.35, 1 - ((r - R0) / (maxR - R0 + 1)) * 0.6);
      const played = date >= first && hist.has(date);
      ctx.beginPath();
      if (played && skyPat) { ctx.globalAlpha = 0.9 * fade; ctx.fillStyle = skyPat; ctx.arc(x, y, 4.5, 0, TAU); }
      else { ctx.globalAlpha = (date < first ? 0.25 : 0.42) * fade; ctx.fillStyle = pal.faint; ctx.arc(x, y, 1.4, 0, TAU); }
      ctx.fill();
      if (date < first) continue;
      if (teelu.has(date)) {
        ctx.globalAlpha = 0.8 * fade;
        ctx.beginPath();
        ctx.fillStyle = pal.butter;
        ctx.arc(x + Math.cos(a) * 10, y + Math.sin(a) * 10, 2, 0, TAU);
        ctx.fill();
      }
      if (k === 0) {
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.strokeStyle = pal.rose;
        ctx.lineWidth = 1.5;
        ctx.arc(x, y, 5, 0, TAU);
        ctx.stroke();
      }
    }
  }
  // a few faint stars, on every screen
  const stars = seeded(0x5eed);
  for (let i = 0; i < 90; i++) {
    const x = stars() * W, y = stars() * H, r = 0.45 + stars() * 0.75, a = 0.12 + stars() * 0.3, t = stars();
    ctx.globalAlpha = a;
    ctx.fillStyle = t < 0.1 ? T('--butter') : t < 0.2 ? T('--lilac') : T('--ink-dim');
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
let skyQueued = false;
function queueSky() {
  if (skyQueued) return;
  skyQueued = true;
  requestAnimationFrame(() => { skyQueued = false; paintSky(); });
}

// ---- boot ---------------------------------------------------------------------------------------------------
function buildStatic() {
  // the mark: three rounded bars, the middle one in peach/lilac stripes
  const mark = $('mark');
  const defs = svgEl('defs', null, mark);
  const pat = svgEl('pattern', { id: 'nw-mark-stripes', width: 4, height: 4, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  svgEl('rect', { width: 4, height: 4, style: 'fill: var(--lilac)' }, pat);
  svgEl('rect', { width: 2, height: 4, style: 'fill: var(--peach)' }, pat);
  svgEl('rect', { y: 2.25, width: 26, height: 3.5, rx: 1.75, class: 'b' }, mark);
  svgEl('rect', { y: 8.25, width: 34, height: 3.5, rx: 1.75, fill: 'url(#nw-mark-stripes)' }, mark);
  svgEl('rect', { y: 14.25, width: 20, height: 3.5, rx: 1.75, class: 'b' }, mark);
  $('legend-btn').replaceChildren(icon('question'));
  $('retry').replaceChildren(icon('retry'));
}
// a returning player on a new browser skips the first run; their history is only known after sign-in, once the
// relays have answered ('history'), so the check repeats then
const returning = () => { if (taughtV === 0 && safe(() => NW.net.history().size, 0) > 0) setTaught(1); };
function listen() {
  const on = (type, fn) => { try { NW.net.on(type, fn); } catch {} };
  on('day', (e) => { if (!e || e.date === S.date) queueRender(); });
  on('peers', (e) => {
    for (const pk of (e && e.joined) || []) greetPeer(pk);
    queueRender();
  });
  on('conn', queueRender);
  on('ack', () => flash($('save')));
  on('history', () => { returning(); queueSky(); queueRender(); });
  on('identity', () => { S.spot = null; cancelStroke(); undoS.clear(); returning(); queueRender(); queueSky(); });
  // a new day began while this page is open: the page stays, › beats
  on('today', (e) => { rolled = (e && e.date) || getToday(); queueRender(); queueSky(); });
}
async function boot() {
  const q = new URLSearchParams(location.search);
  // the same prefix rule as net.js start(): dev is reduced to [0-9a-z], at most 8 characters
  LS = q.has('mock') ? 'nwm' + (q.get('dev') || '').replace(/[^0-9a-z]/gi, '').slice(0, 8) + '.' : 'nw.';
  reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  coarse = matchMedia('(pointer: coarse)').matches;
  hadSk = store.has('sk');
  taughtV = Math.max(0, Math.min(3, +store.get('taught') || 0));
  K = (NW.sheet && NW.sheet.K) || (NW.C && NW.C.K) || 7;
  buildStatic();
  // the text first: it needs nothing from the network
  today = getToday();
  S.date = hashDate() || today;
  buildPage(S.date, 'arrive');
  arrived.add(S.date);
  wire();
  render();
  paintSky();
  if (q.has('debug')) window.__nwApp = { S, render, get dv() { return dv; }, get P() { return P; } };

  try { await NW.net.start(); } catch {}
  ready = true;
  readyResolve();
  listen();
  today = getToday();
  const d = hashDate() || today;
  if (d !== S.date) { S.date = d; buildPage(d, 'swap'); }
  if (P) P.fresh = true;   // what the local replica already holds appears with the page, without growing
  safe(() => NW.net.view(S.date));
  render();   // the replica now: start() doesn't wait on late libraries, but the probe below does
  try { libsMissing = (await NW.net.derivePublicKey(PROBE_SK)) == null; } catch { libsMissing = true; }
  returning();
  render();
  queueSky();
  if (S.gate.preview == null && !S.gate.empty) { const i = $('name'); if (i) onName({ target: i }); }   // typed before crypto loaded
  if (store.get('greet') !== today) {
    store.set('greet', today);
    setTimeout(() => { say('ollu', () => ['ollu']); announce('ollu, a new page of noise words.'); }, 900);
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
